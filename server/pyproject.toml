[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolens-server"
version = "0.1.0"
description = "AudioLens server: near real-time Whisper transcription over WebSocket"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.1,<2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "websockets>=12",
]

[project.optional-dependencies]
# CUDA 12 wheels for CTranslate2 (cuBLAS + cuDNN 9). Needed on the GPU host.
gpu = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tools"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
